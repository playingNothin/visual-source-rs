<div class="container">
<div class="header">
<div class="header-icon"><img src="data:image/png;base64,__FAVICON_B64__" style="width:48px;height:48px;object-fit:contain;display:block;" alt=""></div>
<div class="header-text">
<h1>basicallyLua</h1>
<p>It's not 'almostLua' or 'Powerlang'. It's basicallyLua, and it can run directly on your machine without internet.</p>
</div>
<div style="margin-left:auto"><span class="msg info" id="engine-status">local engine: loading…</span></div>
</div>
<div class="settings-bar">
<button class="settings-btn" id="settings-toggle" onclick="_sfx.tab();toggleSettings()">settings</button>
</div>
<div class="settings-panel" id="settings-panel">
<div class="settings-title">preferences</div>
<div class="settings-row" id="dark-mode-row">
<span class="settings-label">theme</span>
<label class="toggle-box" for="cfg-dark" style="margin:0">
<input id="cfg-dark" onchange="toggleDark()" type="checkbox">
<span class="box"></span>
</label>
<span class="settings-label" style="min-width:0;color:var(--text-mute)">dark mode</span>
</div>
<div class="settings-row">
<span class="settings-label">sounds</span>
<label class="toggle-box" for="cfg-mute" style="margin:0">
<input id="cfg-mute" onchange="saveMute()" type="checkbox">
<span class="box"></span>
</label>
<span class="settings-label" style="min-width:0;color:var(--text-mute)">mute all</span>
</div>
<div class="settings-row">
<span class="settings-label">font</span>
<input class="settings-input" id="cfg-font" onblur="_sfx.unfocus()" onfocus="_sfx.focus()" oninput="_sfx.type()" placeholder="Consolas" spellcheck="false" type="text">
<button class="settings-apply" onclick="_sfx.click();applyFont()">apply</button>
</div>
</div>
<div class="card">
<div class="tabs">
<button class="tab active" onclick="_sfx.tab();switchTab('encode')">Encoder</button>
<button class="tab" onclick="_sfx.tab();switchTab('decode')">Decoder</button>
<button class="tab" onclick="_sfx.tab();switchTab('luau')">To Luau</button>
<button class="tab" onclick="_sfx.tab();switchTab('luautos')">To VS</button>
<button class="tab" onclick="_sfx.tab();switchTab('roundtrip')">Roundtrip</button>
<button class="tab" onclick="_sfx.tab();switchTab('vspreview')">VS-Preview</button>
</div>
<div class="panel active" id="panel-encode">
<div class="panel-body">
<div class="field">
<label>decoded input</label>
<textarea id="enc-input" placeholder="paste your visualsource script..."></textarea>
</div>
<div class="button-group">
<button class="btn-primary" id="enc-btn" onclick="_sfx.click();doEncode()">Encode</button>
<button class="btn-secondary" onclick="_sfx.click();clearPanel('encode')">Clear</button>
</div>
<div class="message" id="enc-message"></div>
</div>
<div class="divider"></div>
<div class="panel-body">
<div class="field">
<label>encoded output</label>
<textarea id="enc-output" placeholder="encoded text shows up here..." readonly=""></textarea>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-secondary" onclick="_sfx.copy();copyText('enc-output','enc-message')">Copy</button>
<button class="btn-secondary" onclick="_sfx.click();downloadText('enc-output','output.vs')">Download as .vs</button>
</div>
</div>
</div>
<div class="panel" id="panel-decode">
<div class="panel-body">
<div class="field">
<label>encoded input</label>
<textarea id="dec-input" placeholder="paste your encoded visualsource here..."></textarea>
</div>
<div class="button-group">
<button class="btn-primary" id="dec-btn" onclick="_sfx.click();doDecode()">Decode</button>
<button class="btn-secondary" onclick="_sfx.click();clearPanel('decode')">Clear</button>
</div>
<div class="message" id="dec-message"></div>
</div>
<div class="divider"></div>
<div class="panel-body">
<div class="field">
<label>decoded output</label>
<textarea id="dec-output" placeholder="decoded text shows up here..." readonly=""></textarea>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-secondary" onclick="_sfx.copy();copyText('dec-output','dec-message')">Copy</button>
</div>
</div>
</div>
<div class="panel" id="panel-luau">
<div class="panel-body">
<div class="field">
<label>visualsource input (encoded)</label>
<textarea id="luau-input" placeholder="paste your visualsource payload here..."></textarea>
</div>
<div class="button-group">
<button class="btn-primary" id="luau-btn" onclick="_sfx.click();doToLuau()">Convert to Luau</button>
<button class="btn-secondary" onclick="_sfx.click();clearPanel('luau')">Clear</button>
</div>
<div class="message" id="luau-message"></div>
</div>
<div class="divider"></div>
<div class="panel-body">
<div class="field">
<label>luau output</label>
<textarea id="luau-output" placeholder="reconstructed luau shows up here..." readonly=""></textarea>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-secondary" onclick="_sfx.copy();copyText('luau-output','luau-message')">Copy</button>
<button class="btn-secondary" onclick="_sfx.click();downloadText('luau-output','script.luau')">Download as .luau</button>
</div>
</div>
</div>
<div class="panel" id="panel-luautos">
<div class="panel-body">
<div class="field">
<label>luau input</label>
<textarea id="luautos-input" placeholder="paste your luau code here..."></textarea>
</div>
<div class="button-group">
<button class="btn-primary" id="luautos-btn" onclick="_sfx.click();doToVs()">Convert to VS</button>
<button class="btn-secondary" onclick="_sfx.click();clearPanel('luautos')">Clear</button>
</div>
<div class="message" id="luautos-message"></div>
<div id="luautos-notes"></div>
</div>
<div class="divider"></div>
<div class="panel-body">
<div class="field">
<label>visualsource output</label>
<textarea id="luautos-output" placeholder="encoded payload shows up here..." readonly=""></textarea>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-secondary" onclick="_sfx.copy();copyText('luautos-output','luautos-message')">Copy</button>
<button class="btn-secondary" onclick="_sfx.click();downloadText('luautos-output','script.vs')">Download as .vs</button>
</div>
</div>
</div>
<div class="panel" id="panel-roundtrip">
<div class="panel-body">
<div class="field">
<label>visualsource payload</label>
<textarea id="rt-input" placeholder="paste an encoded payload to verify it round-trips losslessly..."></textarea>
</div>
<div class="button-group">
<button class="btn-primary" id="rt-btn" onclick="_sfx.click();doRoundtrip()">Check losslessness</button>
<button class="btn-secondary" onclick="_sfx.click();clearPanel('roundtrip')">Clear</button>
</div>
<div class="message" id="rt-message"></div>
</div>
<div class="divider"></div>
<div class="panel-body">
<div class="field">
<label>layered report</label>
<textarea id="rt-output" placeholder="decode → records → re-decode report shows up here..." readonly=""></textarea>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-secondary" onclick="_sfx.copy();copyText('rt-output','rt-message')">Copy</button>
</div>
</div>
</div>
<div class="panel" id="panel-vspreview">
<div class="panel-body">
<div class="field">
<label>visualsource payload</label>
<textarea id="pv-input" placeholder="paste an encoded payload to render its block graph..."></textarea>
</div>
<div class="button-group">
<button class="btn-primary" id="pv-btn" onclick="_sfx.click();doPreview()">Render preview</button>
<button class="btn-secondary" onclick="_sfx.click();clearPanel('vspreview')">Clear</button>
</div>
<div class="message" id="pv-message"></div>
</div>
<div class="divider"></div>
<div class="panel-body">
<div id="pv-legend" class="pv-legend"></div>
<div style="display:flex;gap:8px;align-items:center;margin:2px 0 8px;flex-wrap:wrap">
<button class="btn-secondary" onclick="_sfx.click();pvZoom(0.8)" title="zoom out">−</button>
<button class="btn-secondary" id="pv-zoom-label" onclick="_sfx.click();pvZoomReset()" title="reset zoom">100%</button>
<button class="btn-secondary" onclick="_sfx.click();pvZoom(1.25)" title="zoom in">+</button>
<span style="font-size:11px;opacity:.65">same layout as the RetroStudio editor — chains flow down, colors follow the block category</span>
</div>
<div id="pv-details"></div>
<div class="preview-wrap" id="pv-graph"></div>
</div>
</div>
</div>
</div>
