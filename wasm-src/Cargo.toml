[package]
name = "visual-source-rs-wasm"
version = "1.1.2"
edition = "2024"
description = "WebAssembly bindings for the VisualSource transpiler (browser UI)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
visual-source-rs = { path = ".." }
serde_json = "1.0"

[profile.release]
# Smaller wasm = faster browser load. These flags trade compile time for size.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
